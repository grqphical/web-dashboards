<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>SFU Racerbot dashboards</title>
  <link rel="icon" href="/img/icon-blue.png" type="image/png" />
  <!--
    The landing page: a bar and one card per car. Plain HTML and one inline
    script, no build step.

    It borrows the team website's "Constructor" look (sfu-racerbot/
    racerbot-website, static/css/main.css): its palette and fonts, the navy
    bar with a checker edge, race-plate ids, painted-corner slots and the
    sheared button. Light or dark follows the system; the toggle pins a
    choice. Keep it short: anything that is not a car belongs in the README.

    Colour carries state only in the status marker. Nothing changes size as
    data arrives: each card reserves its detail line.

    Cards come from /api/cars: the cars in CARS (wrangler.jsonc), in order,
    with each relay's connection state and viewer count.
  -->
  <script>
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <style>
    :root {
      color-scheme: light dark;
      --paper: #ffffff;
      --navy: #0c1e3a;
      --ink: #16233d;
      --muted: #4c5a76;
      --faint: #7a89a6;
      --heading: #0c1e3a;
      --mist: #aebfd9;
      --blue: #1d5f9e;
      --blue-deep: #164a7c;
      --blue-hi: #7fb2e5;
      --plate: var(--blue);
      --line: #dbe1ec;
      --corner: #0c1e3a;
      --on: #157a3f;
      --off: #b42318;
      --idle: #7a89a6;
      --display: 'Saira Condensed', 'Arial Narrow', sans-serif;
      --body: 'Public Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #0b1626; --navy: #16294c; --ink: #dde5f2; --muted: #9fb0cc; --faint: #71829f;
        --heading: #f3f7fc; --blue: #2f6690; --blue-deep: #27567a; --plate: var(--blue-hi);
        --line: rgba(154, 183, 220, 0.18); --corner: var(--blue-hi);
        --on: #3ecf7a; --off: #ff6b6b; --idle: #71829f;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0b1626; --navy: #16294c; --ink: #dde5f2; --muted: #9fb0cc; --faint: #71829f;
      --heading: #f3f7fc; --blue: #2f6690; --blue-deep: #27567a; --plate: var(--blue-hi);
      --line: rgba(154, 183, 220, 0.18); --corner: var(--blue-hi);
      --on: #3ecf7a; --off: #ff6b6b; --idle: #71829f;
    }
    :root[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--body); background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 3px; }
    .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

    /* Navy bar with a checker edge. */
    header { position: relative; background: var(--navy); padding-bottom: 8px; }
    header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
      background: repeating-conic-gradient(#ffffff 0 25%, transparent 0 50%) 0 0/16px 16px;
    }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 1rem; }
    .logo { display: flex; align-items: center; gap: 0.55rem; font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: 0.03em; text-transform: uppercase; color: #ffffff; white-space: nowrap; }
    .logo img { width: 38px; height: 38px; }
    .logo em { font-style: normal; color: var(--blue-hi); }
    nav { display: flex; align-items: center; gap: 1.25rem; }
    nav a, .theme-toggle { font-family: var(--mono); font-size: 0.74rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mist); }
    nav a:hover, .theme-toggle:hover { color: #ffffff; }
    .theme-toggle { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer; }
    .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .sun { display: none; }
      :root:not([data-theme="light"]) .theme-toggle .moon { display: block; }
    }

    /* The cards take whatever height the window has. */
    main.wrap { flex: 1; display: flex; flex-direction: column; padding: 2rem 1.5rem 1.75rem; }
    /* Reserved height: a failed poll must not push the cards down. */
    #error { min-height: 1.25rem; margin-bottom: 0.75rem; font-family: var(--mono); font-size: 0.75rem; color: var(--off); }

    .garage { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); grid-auto-rows: minmax(300px, 1fr); gap: 1.5rem; }

    /* Painted-corner slot, as on the website's registers. */
    .car {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.6rem 1.6rem;
      background-image:
        linear-gradient(var(--corner), var(--corner)), linear-gradient(var(--corner), var(--corner)),
        linear-gradient(var(--corner), var(--corner)), linear-gradient(var(--corner), var(--corner)),
        linear-gradient(var(--corner), var(--corner)), linear-gradient(var(--corner), var(--corner));
      background-repeat: no-repeat;
      background-size: 100% 2px, 2px 20px, 2px 20px, 20px 2px, 2px 20px, 20px 2px;
      background-position: 0 0, 0 0, 100% 0, 0 100%, 100% 100%, 100% 100%;
    }
    .car > * { position: relative; z-index: 1; }
    /* The race number: the car's number, big and quiet, like on a body panel. */
    .car > .num {
      position: absolute; z-index: 0; right: 1.6rem; top: 50%; transform: translateY(-50%);
      font-family: var(--display); font-weight: 800; line-height: 0.8;
      font-size: clamp(9rem, 34vh, 20rem); color: var(--line);
      user-select: none; pointer-events: none;
    }
    .car-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .plate {
      font-family: var(--mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--plate); border: 1px solid currentColor; padding: 0.1rem 0.6rem 0.1rem 0.75rem;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 7px 100%);
    }
    .state { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .state i { width: 8px; height: 8px; background: var(--idle); }
    .state[data-state="on"] i { background: var(--on); }
    .state[data-state="off"] i { background: var(--off); }
    .state[data-state="on"] b { color: var(--on); }
    .state[data-state="off"] b { color: var(--off); }
    .state b { font-weight: 600; color: var(--idle); }

    .car h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(2.3rem, 4vw, 3.2rem); line-height: 1; color: var(--heading); margin: 1rem 0 0.4rem; }
    /* One reserved line: an error appearing never moves the buttons. */
    .detail { height: 1.5em; font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.9rem; }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: auto; }
    /* Diagnostics: a quieter link at the end of the row; red while the car is offline. */
    .actions .btn-diag {
      margin-left: auto; padding: 0.35rem 0; font-family: var(--mono); font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.1em; color: var(--muted); border: 0; border-bottom: 1px solid currentColor;
    }
    .actions .btn-diag:hover { color: var(--heading); }
    .car[data-state="off"] .btn-diag { color: var(--off); }
    .btn { font-family: var(--display); font-weight: 700; font-size: 0.98rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.6rem 1.35rem; text-align: center; transition: background 0.15s, border-color 0.15s; }
    .btn-primary { background: var(--blue); color: #ffffff; clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%); }
    .btn-primary:hover { background: var(--blue-deep); }
    .btn-ghost { border: 1px solid var(--line); color: var(--heading); background: var(--paper); }
    .btn-ghost:hover { border-color: var(--heading); }

    .footnote { margin-top: 1.25rem; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--faint); }

    /* Slim navy footer, checker on its top edge. */
    footer { position: relative; background: var(--navy); color: var(--mist); padding: 1.1rem 0 1rem; margin-top: 8px; }
    footer::before {
      content: ''; position: absolute; left: 0; right: 0; top: -8px; height: 8px;
      background: repeating-conic-gradient(#ffffff 0 25%, var(--navy) 0 50%) 0 0/16px 16px;
    }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1.5rem; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
    footer nav { gap: 1.25rem; }

    @media (max-width: 600px) {
      .wrap { padding: 0 1rem; }
      .hide-narrow { display: none; }
      main.wrap { padding: 1.5rem 1rem 1.25rem; }
      .car > .num { display: none; }
      .garage { grid-auto-rows: auto; }
      .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; }
      .actions .btn-diag { grid-column: 1 / -1; justify-self: start; margin: 0.2rem 0 0; }
      .btn { padding: 0.6rem 0.4rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="/" aria-label="SFU Racerbot dashboards">
        <img src="/img/icon.png" alt="" /><span>SFU <em>Racerbot</em></span>
      </a>
      <nav aria-label="Site">
        <a class="hide-narrow" href="https://sfuracerbot.ca/">Team site</a>
        <a href="/cdn-cgi/access/logout">Sign out</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle colour theme">
          <svg class="sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
          <svg class="moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="error" role="status"></div>
    <div id="cars" class="garage"><p>Loading cars&hellip;</p></div>
    <p class="footnote">
      Advanced needs Chrome or Edge. Diagnostics tests every hop from this site to the car and says what to fix.
    </p>
  </main>

  <footer>
    <div class="wrap">
      <span>SFU Racerbot &middot; Simon Fraser University</span>
      <nav aria-label="Elsewhere">
        <a href="https://github.com/sfu-racerbot/web-dashboards#using-it">Help</a>
        <a href="https://github.com/sfu-racerbot/web-dashboards">GitHub</a>
      </nav>
    </div>
  </footer>

  <script>
    (() => {
      'use strict';

      // Theme: system preference until clicked, as on the website.
      const html = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const dark = window.matchMedia('(prefers-color-scheme: dark)');
      const theme = () => html.getAttribute('data-theme') || (dark.matches ? 'dark' : 'light');
      const label = () => toggle.setAttribute('aria-label', `Switch to ${theme() === 'dark' ? 'light' : 'dark'} mode`);
      toggle.addEventListener('click', () => {
        const next = theme() === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch {}
        label();
      });
      dark.addEventListener('change', label);
      label();

      const carsEl = document.getElementById('cars');
      const errorEl = document.getElementById('error');
      // Each poll is one Worker request plus one Durable Object request per
      // car (docs/costs.md), so it is slow on purpose, and stops while hidden.
      const POLL_MS = 30000;
      const cards = new Map();

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function button(href, label, className, title) {
        const a = el('a', `btn ${className}`, label);
        a.href = href;
        if (title) a.title = title;
        return a;
      }

      // Lichtblick opens the connection named in its URL: ?ds= picks the
      // Foxglove WebSocket data source and ds.url says where. It must be an
      // absolute ws(s):// URL, built here from this page's own origin.
      function advancedHref(car) {
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        const bridge = `${scheme}://${location.host}${car.links.bridge}`;
        return `${car.links.advanced}?ds=foxglove-websocket&ds.url=${encodeURIComponent(bridge)}`;
      }

      function card(car) {
        const root = el('article', 'car');
        const num = el('span', 'num', car.id.replace(/\D/g, ''));
        num.setAttribute('aria-hidden', 'true');
        const top = el('div', 'car-top');
        const state = el('span', 'state');
        const marker = el('i');
        const word = el('b', '', 'Checking');
        const count = el('span');
        state.append(marker, word, count);
        top.append(el('span', 'plate', car.id), state);
        const detail = el('p', 'detail');
        const actions = el('div', 'actions');
        actions.append(
          button(car.links.simple, 'Simple', 'btn-primary'),
          button(advancedHref(car), 'Advanced', 'btn-ghost', 'Lichtblick. Chrome or Edge.'),
          button(car.links.camera, 'Camera', 'btn-ghost'),
          button(`/${car.id}/check`, 'Diagnostics', 'btn-diag', 'Test every hop from this site to the car'),
        );
        root.append(num, top, el('h2', '', car.name), detail, actions);
        return { root, state, word, count, detail };
      }

      function describe(status) {
        if (!status) return { state: 'idle', word: 'Unknown', count: '', detail: '' };
        const error = status.error || '';
        if (status.car_connected) return { state: 'on', word: 'Online', count: `· ${status.viewers} watching`, detail: '' };
        // With nobody watching the relay deliberately holds no car
        // connection, so "not connected" is not evidence the car is down.
        if (status.viewers === 0) return { state: 'idle', word: 'Idle', count: '', detail: error ? `Last try: ${error}` : '' };
        return { state: 'off', word: 'Offline', count: `· ${status.viewers} watching`, detail: error || 'The site cannot reach this car.' };
      }

      function render(data) {
        if (!data.cars.length) {
          carsEl.textContent = 'No cars are configured.';
          return;
        }
        for (const car of data.cars) {
          let entry = cards.get(car.id);
          if (!entry) {
            if (!cards.size) carsEl.textContent = '';
            entry = card(car);
            cards.set(car.id, entry);
            carsEl.append(entry.root);
          }
          const view = describe(car.status);
          entry.state.dataset.state = view.state;
          entry.root.dataset.state = view.state;
          entry.word.textContent = view.word;
          entry.count.textContent = view.count;
          entry.detail.textContent = view.detail;
          entry.detail.title = view.detail;
        }
      }

      async function poll() {
        if (document.visibilityState === 'hidden') return;
        try {
          const response = await fetch('/api/cars', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${(await response.text()).trim()}`);
          render(await response.json());
          errorEl.textContent = '';
        } catch (err) {
          errorEl.textContent = `Could not load car status: ${err.message}`;
        }
      }

      poll();
      setInterval(poll, POLL_MS);
      document.addEventListener('visibilitychange', poll);
    })();
  </script>
</body>
</html>
